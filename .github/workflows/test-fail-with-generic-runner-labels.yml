name: Test Fail with Generic Runner Labels

on:
  workflow_dispatch:

# Blocked by the generic-runner-labels-policy: its
# enable_generic_runner_labels flag adds every standard GitHub-hosted label to
# the disallowed set at evaluation time — so all three jobs below violate the
# policy without any label being listed in the policy itself.
jobs:
  test-fail-ubuntu:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test on generic-blocked runner
        run: |
          echo "Running on ubuntu-latest (blocked via github-hosted-standard-runners)"

  test-fail-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test on generic-blocked runner
        run: |
          echo "Running on windows-latest (blocked via github-hosted-standard-runners)"

  test-fail-macos:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test on generic-blocked runner
        run: |
          echo "Running on macos-latest (blocked via github-hosted-standard-runners)"
